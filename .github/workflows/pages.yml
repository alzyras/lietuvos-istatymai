name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout laws corpus
        uses: actions/checkout@v6

      - name: Read pinned generator version
        id: generator-version
        run: |
          version=$(cat generator-version.txt)
          if [[ ! "$version" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid generator-version.txt: $version" >&2
            exit 1
          fi
          echo "sha=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout site generator
        uses: actions/checkout@v6
        with:
          repository: alzyras/lietuvos-istatymai-gen
          ref: ${{ steps.generator-version.outputs.sha }}
          path: .site-generator
          ssh-key: ${{ secrets.GENERATOR_REPO_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install generator
        run: python -m pip install ./.site-generator

      - name: Build static site
        run: lietuvos-istatymai build-site --corpus-dir . --output-dir _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
